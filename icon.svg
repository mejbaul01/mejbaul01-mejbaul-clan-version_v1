<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#140620"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Background rounded app icon square -->
  <rect width="128" height="128" rx="28" fill="url(#bgGlow)"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Golden Wing Feathers Left -->
  <path d="M64,65 C45,45 28,32 16,36 C14,50 25,68 40,78 C30,76 22,70 18,65 C16,74 24,84 38,88 Z" fill="url(#wingGrad)" opacity="0.95"/>

  <!-- Golden Wing Feathers Right -->
  <path d="M64,65 C83,45 100,32 112,36 C114,50 103,68 88,78 C98,76 106,70 110,65 C112,74 104,84 90,88 Z" fill="url(#wingGrad)" opacity="0.95"/>

  <!-- Crystal Shards Top Center -->
  <polygon points="64,18 73,38 64,48 55,38" fill="#c084fc" stroke="#f3e8ff" stroke-width="1.5"/>
  <polygon points="50,26 58,42 50,50 42,40" fill="#38bdf8" opacity="0.85"/>
  <polygon points="78,26 86,40 78,50 70,42" fill="#38bdf8" opacity="0.85"/>

  <!-- Center Heart Ruby Gemstone -->
  <path d="M64,74 C64,74 46,60 46,46 C46,38 52,34 58,35 C61,35 63,38 64,40 C65,38 67,35 70,35 C76,34 82,38 82,46 C82,60 64,74 64,74 Z" fill="url(#rubyGrad)" stroke="#fecdd3" stroke-width="2"/>
  <circle cx="56" cy="42" r="3.5" fill="#ffffff" opacity="0.85"/>

  <!-- Royal Golden Crown Base -->
  <path d="M42,88 L86,88 L82,102 L46,102 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1.5"/>
  <circle cx="48" cy="95" r="2.5" fill="#ef4444"/>
  <circle cx="64" cy="95" r="3.5" fill="#a855f7"/>
  <circle cx="80" cy="95" r="2.5" fill="#3b82f6"/>
</svg>
